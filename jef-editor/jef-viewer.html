<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEF Viewer</title>
<style>
  :root { --bg:#f4f4f2; --fg:#222; --muted:#666; --card:#fff; --line:#ddd; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  #drop { border:2px dashed #aaa; border-radius:10px; padding:20px; text-align:center; background:var(--card); cursor:pointer; }
  #drop.over { border-color:#2a7; background:#eefaf3; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:12px 0; }
  #stage { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  canvas { width:100%; height:auto; display:block; }
  #info { color:var(--muted); margin-top:10px; line-height:1.6; }
  .sw { display:inline-block; width:12px; height:12px; border:1px solid #999; vertical-align:middle; margin-right:4px; }
  button { padding:6px 12px; }
</style>
</head>
<body>
<main>
  <h1>JEF Embroidery Viewer</h1>
  <label id="drop">
    Drop a <b>.JEF</b> file here, or click to choose one
    <input id="file" type="file" accept=".jef,.JEF" hidden>
  </label>

  <div class="controls">
    <label><input type="checkbox" id="jumps"> Show jumps/trims</label>
    <label><input type="checkbox" id="points"> Show needle points</label>
    <label>Line width <input type="range" id="lw" min="0.5" max="6" step="0.5" value="2"></label>
    <label>Background <input type="color" id="bgc" value="#ffffff"></label>
    <button id="save" disabled>Save PNG</button>
  </div>

  <div id="stage"><canvas id="cv" width="900" height="300"></canvas></div>
  <div id="info">No file loaded.</div>
</main>

<script>
// Janome thread palette (index -> RGB). Approximate; unknown indexes fall back to a generated color.
const PALETTE = [
  [0,0,0],[0,0,0],[255,255,255],[255,255,23],[255,102,0],[47,89,51],[35,115,54],
  [101,194,200],[171,90,150],[246,105,160],[255,0,0],[177,112,78],[11,47,132],
  [228,195,93],[72,26,5],[172,156,199],[252,242,148],[249,153,183],[250,179,129],
  [201,164,128],[151,5,51],[160,184,204],[127,194,28],[229,229,229],[136,155,155],
  [152,214,189],[178,225,227],[54,139,160],[79,131,171],[56,106,145],[7,22,80]
];
const colorFor = (idx, n) => PALETTE[idx]
  ? `rgb(${PALETTE[idx].join(",")})`
  : `hsl(${(n * 67) % 360} 70% 45%)`;

let design = null;

function parseJEF(buf) {
  const d = new DataView(buf);
  const stitchOffset = d.getInt32(0, true);
  const date = new TextDecoder("ascii").decode(new Uint8Array(buf, 8, 14));
  const threadCount = d.getInt32(24, true);
  const stitchCount = d.getInt32(28, true);
  const hoop = d.getInt32(32, true);
  const threads = [];
  for (let t = 0; t < threadCount; t++) threads.push(d.getInt32(0x74 + 4 * t, true));

  // Decode stitches into segments grouped by color.
  const segs = []; // {x1,y1,x2,y2,color,jump}
  const pts = [];
  let x = 0, y = 0, color = 0, i = stitchOffset;
  let stitches = 0, jumps = 0, changes = 0;
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  while (i < buf.byteLength - 1) {
    const b0 = d.getUint8(i);
    if (b0 === 0x80) {
      const cmd = d.getUint8(i + 1);
      if (cmd === 0x10) break;                       // end
      if (cmd === 0x01) { color++; changes++; // color change: 80 01 dx dy
        const nx = x + d.getInt8(i + 2), ny = y + d.getInt8(i + 3);
        segs.push({x1:x,y1:y,x2:nx,y2:ny,color,jump:true}); x = nx; y = ny; i += 4;
        continue;
      }
      // 0x02 (jump/trim) and anything else: 4-byte move without sewing
      const nx = x + d.getInt8(i + 2), ny = y + d.getInt8(i + 3);
      segs.push({x1:x,y1:y,x2:nx,y2:ny,color,jump:true});
      x = nx; y = ny; jumps++; i += 4;
    } else {
      const nx = x + d.getInt8(i), ny = y + d.getInt8(i + 1);
      segs.push({x1:x,y1:y,x2:nx,y2:ny,color,jump:false});
      pts.push([nx, ny]);
      x = nx; y = ny; stitches++; i += 2;
    }
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  return { date, threadCount, stitchCount, hoop, threads, segs, pts,
           stitches, jumps, changes, minX, maxX, minY, maxY };
}

function render() {
  if (!design) return;
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const D = design, pad = 20;
  const w = D.maxX - D.minX || 1, h = D.maxY - D.minY || 1;
  const width = 900;
  const scale = (width - 2 * pad) / w;
  cv.width = width;
  cv.height = Math.max(60, Math.round(h * scale + 2 * pad));
  // JEF uses +Y = up, canvas uses +Y = down, so flip Y.
  const tx = v => pad + (v - D.minX) * scale;
  const ty = v => pad + (D.maxY - v) * scale;

  ctx.fillStyle = document.getElementById("bgc").value;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const lw = +document.getElementById("lw").value;
  const showJumps = document.getElementById("jumps").checked;

  for (const s of D.segs) {
    if (s.jump && !showJumps) continue;
    ctx.beginPath();
    ctx.moveTo(tx(s.x1), ty(s.y1));
    ctx.lineTo(tx(s.x2), ty(s.y2));
    if (s.jump) { ctx.strokeStyle = "rgba(220,0,0,.6)"; ctx.lineWidth = 1; ctx.setLineDash([4,3]); }
    else { ctx.strokeStyle = colorFor(D.threads[s.color], s.color); ctx.lineWidth = lw; ctx.setLineDash([]); }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  if (document.getElementById("points").checked) {
    ctx.fillStyle = "#000";
    for (const [px, py] of D.pts) ctx.fillRect(tx(px) - 1, ty(py) - 1, 2, 2);
  }
}

function showInfo(name) {
  const D = design;
  const swatches = D.threads.map((c, n) =>
    `<span class="sw" style="background:${colorFor(c, n)}"></span>#${c}`).join(" &nbsp; ");
  document.getElementById("info").innerHTML =
    `<b>${name}</b><br>` +
    `Size: ${((D.maxX - D.minX) / 10).toFixed(1)} × ${((D.maxY - D.minY) / 10).toFixed(1)} mm ` +
    `(${((D.maxX - D.minX) / 254).toFixed(2)} × ${((D.maxY - D.minY) / 254).toFixed(2)} in)<br>` +
    `Stitches: ${D.stitches} · Jumps/trims: ${D.jumps} · Color changes: ${D.changes} · Header stitch count: ${D.stitchCount}<br>` +
    `Threads (${D.threadCount}): ${swatches}<br>` +
    `Hoop code: ${D.hoop} · Date field: ${D.date}`;
}

function load(file) {
  file.arrayBuffer().then(buf => {
    try {
      design = parseJEF(buf);
      showInfo(file.name);
      render();
      document.getElementById("save").disabled = false;
    } catch (e) {
      document.getElementById("info").textContent = "Could not read file: " + e.message;
    }
  });
}

const drop = document.getElementById("drop");
document.getElementById("file").addEventListener("change", e => e.target.files[0] && load(e.target.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });
["jumps","points","lw","bgc"].forEach(id => document.getElementById(id).addEventListener("input", render));
document.getElementById("save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "design.png";
  a.href = document.getElementById("cv").toDataURL("image/png");
  a.click();
});
</script>
</body>
</html>
